services:
  ccg:
    build:
      context: ../..
      dockerfile: cmd/server/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: ccg
    restart: unless-stopped
    ports:
      - "3021:3000"
    volumes:
      - ccg-data:/data
    environment:
      - CCG_PORT=3000
      - CCG_DATA_DIR=/data
      - CCG_DB_PATH=/data/ccg.db
      - TZ=Asia/Shanghai
      - CCG_BASIC_AUTH_ENABLED=${CCG_BASIC_AUTH_ENABLED:-true}
      - CCG_BASIC_AUTH_USERNAME=${CCG_BASIC_AUTH_USERNAME:-admin}
      - CCG_BASIC_AUTH_PASSWORD=${CCG_BASIC_AUTH_PASSWORD:-changeme}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ccg-network

volumes:
  ccg-data:
    driver: local

networks:
  ccg-network:
    driver: bridge
